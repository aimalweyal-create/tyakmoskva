<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ТЯК-МОСКВА</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6; }
        .toast { animation: fadeInUp 0.3s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        /* Hide number input arrows for a cleaner look */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="text-gray-900 pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40 p-4 flex justify-between items-center">
        <h1 class="text-xl font-black uppercase tracking-tight">ТЯК-МОСКВА 👑</h1>
        <div class="flex gap-4">
            <button onclick="viewCart()" class="relative">
                🛒
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
            </button>
        </div>
    </header>

    <!-- Catalog View -->
    <main id="catalog-view" class="max-w-2xl mx-auto p-4">
        <div id="products-container" class="grid grid-cols-1 gap-4"></div>
    </main>

    <!-- Product Detail View -->
    <main id="detail-view" class="max-w-2xl mx-auto p-4 hidden"></main>

    <!-- Cart View -->
    <main id="cart-view" class="max-w-2xl mx-auto p-4 hidden"></main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-lg hidden toast"></div>

    <script>
        let products = [];
        let cart = JSON.parse(localStorage.getItem('tyak_cart') || '[]');

        // --- Init ---
        async function init() {
            const res = await fetch('/products.json');
            products = await res.json();
            renderCatalog();
            updateCartBadge();
        }

        // --- Catalog ---
        function renderCatalog() {
            document.getElementById('catalog-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('cart-view').classList.add('hidden');

            const container = document.getElementById('products-container');
            if (products.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 mt-10">Каталог пуст. Загрузите товары через админ-панель.</p>';
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden flex cursor-pointer hover:shadow-md transition" onclick="viewProduct(${p.id})">
                    <div class="w-1/3 bg-gray-100 flex items-center justify-center overflow-hidden">
                        ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<div class="w-20 h-20 rounded-full bg-blue-500"></div>`}
                    </div>
                    <div class="p-4 w-2/3 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-md">${p.name}</h3>
                            <p class="text-sm text-gray-500 mt-1 line-clamp-2">${p.desc || ''}</p>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <span class="font-black text-lg">${p.price.toLocaleString('ru-RU')} ₽</span>
                            <button class="bg-blue-600 text-white text-xs px-3 py-1 rounded-lg">Выбрать</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- Product Detail (Input box for each flavor) ---
        function viewProduct(id) {
            const p = products.find(x => x.id === id);
            if (!p) return;

            document.getElementById('catalog-view').classList.add('hidden');
            const view = document.getElementById('detail-view');
            view.classList.remove('hidden');

            let flavorsHtml = p.sizes.map(size => {
                let safeId = size.replace(/\s/g, '');
                // Check if out of stock
                if (p.stock && p.stock[size] === 0) {
                    return `
                        <div class="flex justify-between items-center py-3 border-b bg-gray-50 px-2 rounded-lg">
                            <span class="text-gray-400 line-through">${size}</span>
                            <span class="text-red-500 text-xs font-bold">Нет в наличии</span>
                        </div>`;
                }
                
                let maxQty = (p.stock && p.stock[size] !== undefined) ? p.stock[size] : 99;
                return `
                    <div class="flex justify-between items-center py-3 border-b">
                        <span class="font-medium flex-1">${size}</span>
                        <input type="number" id="qty-${safeId}" min="0" max="${maxQty}" value="0" placeholder="0" class="w-16 p-2 border-2 border-gray-200 rounded-lg text-center font-bold focus:border-blue-500 outline-none" onchange="checkMaxQty('${safeId}', ${maxQty})">
                    </div>`;
            }).join('');

            view.innerHTML = `
                <button onclick="renderCatalog()" class="mb-4 flex items-center text-blue-600 font-semibold">← Назад</button>
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <div class="h-60 bg-gray-100 flex items-center justify-center">
                        ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<div class="w-32 h-32 rounded-full bg-blue-500"></div>`}
                    </div>
                    <div class="p-4">
                        <h2 class="text-2xl font-black">${p.name}</h2>
                        <p class="text-gray-600 mt-1">${p.desc || ''}</p>
                        <p class="text-xl font-black mt-2 mb-4">${p.price.toLocaleString('ru-RU')} ₽</p>
                        
                        <h3 class="font-bold mb-2">Выберите вкусы (введите количество):</h3>
                        <div class="space-y-1 mb-6">${flavorsHtml}</div>

                        <button onclick="addMultipleToCart(${p.id})" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold text-lg hover:bg-green-700 transition">
                            Добавить в корзину
                        </button>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        function checkMaxQty(safeId, maxQty) {
            const input = document.getElementById(`qty-${safeId}`);
            let val = parseInt(input.value) || 0;
            if (val > maxQty) {
                input.value = maxQty;
                showToast(`Доступно только ${maxQty} шт.`);
            }
        }

        function addMultipleToCart(productId) {
            const p = products.find(x => x.id === productId);
            let addedCount = 0;

            for (const size of p.sizes) {
                let safeId = size.replace(/\s/g, '');
                const input = document.getElementById(`qty-${safeId}`);
                if (input) {
                    let qty = parseInt(input.value) || 0;
                    if (qty > 0) {
                        // Double check stock
                        if (p.stock && p.stock[size] !== undefined && qty > p.stock[size]) {
                            qty = p.stock[size];
                        }
                        if (qty > 0) {
                            cart.push({
                                id: p.id,
                                name: p.name,
                                size: size,
                                price: p.price,
                                qty: qty,
                                image: p.image
                            });
                            addedCount += qty;
                        }
                    }
                }
            }

            if (addedCount === 0) {
                showToast("Укажите количество хотя бы для одного вкуса");
                return;
            }

            localStorage.setItem('tyak_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`Добавлено в корзину: ${addedCount} шт`);
            
            // Return to catalog
            setTimeout(() => renderCatalog(), 800);
        }

        // --- Cart ---
        function viewCart() {
            document.getElementById('catalog-view').classList.add('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            const view = document.getElementById('cart-view');
            view.classList.remove('hidden');

            if (cart.length === 0) {
                view.innerHTML = `
                    <button onclick="renderCatalog()" class="mb-4 flex items-center text-blue-600 font-semibold">← Назад</button>
                    <div class="text-center mt-20">
                        <p class="text-xl font-bold mb-2">Корзина пуста</p>
                        <button onclick="renderCatalog()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">В каталог</button>
                    </div>`;
                return;
            }

            let total = 0;
            let itemsHtml = cart.map((item, index) => {
                total += item.price * item.qty;
                return `
                    <div class="bg-white rounded-2xl shadow-sm p-4 flex justify-between items-center mb-3">
                        <div>
                            <h3 class="font-bold">${item.name}</h3>
                            <p class="text-sm text-gray-500">Вкус: ${item.size}</p>
                            <p class="font-black text-blue-600 mt-1">${item.price.toLocaleString('ru-RU')} ₽</p>
                        </div>
                        <div class="flex flex-col items-end">
                            <div class="flex items-center gap-2 mb-2">
                                <button onclick="changeCartQty(${index}, -1)" class="w-7 h-7 rounded-full bg-gray-200 font-bold">-</button>
                                <span class="font-bold w-5 text-center">${item.qty}</span>
                                <button onclick="changeCartQty(${index}, 1)" class="w-7 h-7 rounded-full bg-blue-600 text-white font-bold">+</button>
                            </div>
                            <button onclick="removeFromCart(${index})" class="text-red-500 text-xs">Удалить</button>
                        </div>
                    </div>`;
            }).join('');

            view.innerHTML = `
                <button onclick="renderCatalog()" class="mb-4 flex items-center text-blue-600 font-semibold">← Назад</button>
                <h2 class="text-2xl font-black mb-4">Ваша корзина</h2>
                <div>${itemsHtml}</div>
                <div class="bg-white p-4 rounded-2xl shadow-sm mt-4">
                    <div class="flex justify-between font-black text-xl mb-4">
                        <span>Итого:</span>
                        <span>${total.toLocaleString('ru-RU')} ₽</span>
                    </div>
                    <button onclick="checkout()" class="w-full bg-green-600 text-white p-4 rounded-xl font-bold text-lg">Оформить заказ</button>
                </div>
            `;
        }

        function changeCartQty(index, delta) {
            cart[index].qty = Math.max(1, cart[index].qty + delta);
            localStorage.setItem('tyak_cart', JSON.stringify(cart));
            viewCart();
            updateCartBadge();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('tyak_cart', JSON.stringify(cart));
            viewCart();
            updateCartBadge();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-count');
            let count = cart.reduce((sum, item) => sum + item.qty, 0);
            if (count > 0) {
                badge.innerText = count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- Checkout ---
        function checkout() {
            const tg_user = window.Telegram.WebApp.initDataUnsafe?.user || {};
            const name = tg_user.first_name ? tg_user.first_name + (tg_user.last_name ? ' ' + tg_user.last_name : '') : prompt("Введите ваше имя:");
            const phone = prompt("Введите ваш телефон для связи:");

            if (!name || !phone) {
                showToast("Укажите имя и телефон");
                return;
            }

            fetch('/api/order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: name,
                    phone: phone,
                    items: cart,
                    tg_user: tg_user
                })
            }).then(res => {
                if (res.ok) {
                    localStorage.removeItem('tyak_cart');
                    cart = [];
                    updateCartBadge();
                    document.getElementById('cart-view').innerHTML = `
                        <div class="text-center mt-20">
                            <h2 class="text-3xl font-black text-green-600 mb-4">✅ Заказ оформлен!</h2>
                            <p class="text-gray-600 mb-6">Мы свяжемся с вами в Telegram для подтверждения.</p>
                            <button onclick="renderCatalog()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold">Вернуться в каталог</button>
                        </div>`;
                } else {
                    alert("Ошибка оформления заказа");
                }
            });
        }

        // --- Utils ---
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        }

        // Telegram WebApp setup
        if (window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
            window.Telegram.WebApp.BackButton.onClick(() => {
                if (!document.getElementById('cart-view').classList.contains('hidden')) renderCatalog();
                else if (!document.getElementById('detail-view').classList.contains('hidden')) renderCatalog();
            });
        }

        init();
    </script>
</body>
</html>
