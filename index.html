<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesale Catalog</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f5f7;
    color: #171717;
}

header {
    background: #111;
    color: white;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 20;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

button {
    border: 0;
    border-radius: 9px;
    padding: 10px 15px;
    cursor: pointer;
    font-weight: 600;
}

.admin-btn {
    background: #fff;
    color: #111;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.brands {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 15px;
}

.brand-btn {
    background: white;
    border: 1px solid #ddd;
    white-space: nowrap;
}

.brand-btn.active {
    background: #111;
    color: white;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,.07);
}

.product-image {
    height: 180px;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.card-body {
    padding: 16px;
}

.card h3 {
    margin: 0 0 6px;
}

.price {
    font-size: 19px;
    font-weight: bold;
    margin: 8px 0;
}

.stock {
    color: #16803c;
    font-size: 13px;
    margin-bottom: 10px;
}

select,
input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 10px;
    background: white;
}

.add-btn {
    width: 100%;
    background: #111;
    color: white;
}

.cart-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #111;
    color: white;
    padding: 15px 20px;
    border-radius: 50px;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
    z-index: 30;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 50;
    padding: 20px;
    overflow-y: auto;
}

.modal-content {
    max-width: 650px;
    margin: 30px auto;
    background: white;
    border-radius: 15px;
    padding: 22px;
}

.modal h2 {
    margin-top: 0;
}

.cart-item {
    border-bottom: 1px solid #eee;
    padding: 14px 0;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.qty {
    display: flex;
    align-items: center;
    gap: 8px;
}

.qty button {
    padding: 5px 9px;
    background: #eee;
}

.total {
    font-size: 21px;
    font-weight: bold;
    margin-top: 18px;
}

.close {
    background: #eee;
}

.admin-section {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #eee;
}

.admin-item {
    border: 1px solid #ddd;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.danger {
    background: #dc3545;
    color: white;
}

.success {
    background: #16803c;
    color: white;
}

.secondary {
    background: #eee;
}

.hidden {
    display: none;
}

@media(max-width:600px) {
    .products {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .product-image {
        height: 140px;
    }

    .card-body {
        padding: 11px;
    }

    .card h3 {
        font-size: 15px;
    }

    .price {
        font-size: 16px;
    }

    button {
        padding: 9px 11px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Wholesale Catalog</h1>
    <button class="admin-btn" onclick="openAdmin()">⚙ Admin</button>
</header>

<div class="container">

    <h2>Brands</h2>
    <div class="brands" id="brands"></div>

    <div class="products" id="products"></div>

</div>

<button class="cart-button" onclick="openCart()">
    🛒 Cart <span id="cartCount">0</span>
</button>


<!-- CART -->
<div class="modal" id="cartModal">
    <div class="modal-content">

        <h2>Your Order</h2>

        <div id="cartItems"></div>

        <div class="total">
            Total: €<span id="cartTotal">0.00</span>
        </div>

        <br>

        <input id="customerName" placeholder="Customer name">

        <input id="customerContact" placeholder="Phone / Telegram / Email">

        <button class="success" style="width:100%" onclick="submitOrder()">
            Submit Order
        </button>

        <br><br>

        <button class="close" onclick="closeCart()">
            Close
        </button>

    </div>
</div>


<!-- ADMIN -->
<div class="modal" id="adminModal">
    <div class="modal-content">

        <h2>⚙ Admin Panel</h2>

        <input id="brandName" placeholder="Brand name">

        <button class="success" onclick="addBrand()">
            + Add Brand
        </button>

        <div class="admin-section">
            <h3>Brands & Products</h3>
            <div id="adminList"></div>
        </div>

        <br>

        <button class="close" onclick="closeAdmin()">
            Close
        </button>

    </div>
</div>


<script>

/* =========================
   DATABASE
========================= */

const defaultData = {
    brands: [
        {
            id: 1,
            name: "Brand A",
            products: [
                {
                    id: 101,
                    name: "Product 1",
                    price: 25,
                    stock: 100,
                    image: "",
                    variants: [
                        "Variant A",
                        "Variant B",
                        "Variant C"
                    ]
                },
                {
                    id: 102,
                    name: "Product 2",
                    price: 30,
                    stock: 50,
                    image: "",
                    variants: [
                        "Variant A",
                        "Variant B"
                    ]
                }
            ]
        },
        {
            id: 2,
            name: "Brand B",
            products: [
                {
                    id: 201,
                    name: "Product 3",
                    price: 22,
                    stock: 80,
                    image: "",
                    variants: [
                        "Variant A",
                        "Variant B",
                        "Variant C",
                        "Variant D"
                    ]
                }
            ]
        }
    ]
};

let data = JSON.parse(localStorage.getItem("wholesaleData")) || defaultData;

let selectedBrand = data.brands[0]?.id || null;

let cart = JSON.parse(localStorage.getItem("wholesaleCart")) || [];


/* =========================
   SAVE
========================= */

function saveData() {
    localStorage.setItem(
        "wholesaleData",
        JSON.stringify(data)
    );
}

function saveCart() {
    localStorage.setItem(
        "wholesaleCart",
        JSON.stringify(cart)
    );
}


/* =========================
   DISPLAY BRANDS
========================= */

function renderBrands() {

    const container = document.getElementById("brands");

    container.innerHTML = "";

    data.brands.forEach(brand => {

        const button = document.createElement("button");

        button.className =
            "brand-btn " +
            (selectedBrand === brand.id ? "active" : "");

        button.textContent = brand.name;

        button.onclick = () => {

            selectedBrand = brand.id;

            renderBrands();
            renderProducts();

        };

        container.appendChild(button);

    });
}


/* =========================
   DISPLAY PRODUCTS
========================= */

function renderProducts() {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    const brand =
        data.brands.find(b => b.id === selectedBrand);

    if (!brand) return;

    brand.products.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "card";

        let imageHTML =
            `<div class="product-image">
                No Image
             </div>`;

        if (product.image) {

            imageHTML =
                `<div class="product-image">
                    <img src="${product.image}">
                 </div>`;

        }

        card.innerHTML = `

            ${imageHTML}

            <div class="card-body">

                <h3>${product.name}</h3>

                <div class="price">
                    €${Number(product.price).toFixed(2)}
                </div>

                <div class="stock">
                    Stock: ${product.stock}
                </div>

                <select id="variant-${product.id}">
                    ${product.variants.map(v =>
                        `<option>${v}</option>`
                    ).join("")}
                </select>

                <input
                    type="number"
                    id="quantity-${product.id}"
                    value="1"
                    min="1"
                    max="${product.stock}"
                >

                <button
                    class="add-btn"
                    onclick="addToCart(${product.id})"
                >
                    + Add to Cart
                </button>

            </div>
        `;

        container.appendChild(card);

    });
}


/* =========================
   ADD TO CART
========================= */

function addToCart(productId) {

    const brand =
        data.brands.find(b => b.id === selectedBrand);

    const product =
        brand.products.find(p => p.id === productId);

    const variant =
        document.getElementById(
            `variant-${productId}`
        ).value;

    const quantity =
        Number(document.getElementById(
            `quantity-${productId}`
        ).value);

    if (quantity < 1) return;

    const existing =
        cart.find(item =>
            item.productId === productId &&
            item.variant === variant
        );

    if (existing) {

        existing.quantity += quantity;

    } else {

        cart.push({

            brand: brand.name,

            productId: product.id,

            product: product.name,

            variant: variant,

            price: Number(product.price),

            quantity: quantity

        });

    }

    saveCart();

    updateCartCount();

    alert("Added to cart!");

}


/* =========================
   CART
========================= */

function updateCartCount() {

    const count =
        cart.reduce(
            (sum, item) =>
                sum + item.quantity,
            0
        );

    document.getElementById(
        "cartCount"
    ).textContent = count;
}


function openCart() {

    renderCart();

    document.getElementById(
        "cartModal"
    ).style.display = "block";

}


function closeCart() {

    document.getElementById(
        "cartModal"
    ).style.display = "none";

}


function renderCart() {

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {

        const subtotal =
            item.price * item.quantity;

        total += subtotal;

        const div =
            document.createElement("div");

        div.className = "cart-item";

        div.innerHTML = `

            <div>

                <strong>${item.brand}</strong><br>

                ${item.product}<br>

                <small>
                    ${item.variant}
                </small>

                <br>

                €${item.price.toFixed(2)}

            </div>

            <div>

                <div class="qty">

                    <button onclick="changeQty(${index}, -1)">
                        −
                    </button>

                    <strong>
                        ${item.quantity}
                    </strong>

                    <button onclick="changeQty(${index}, 1)">
                        +
                    </button>

                </div>

                <br>

                <button
                    class="danger"
                    onclick="removeCartItem(${index})"
                >
                    Remove
                </button>

            </div>
        `;

        container.appendChild(div);

    });

    document.getElementById(
        "cartTotal"
    ).textContent = total.toFixed(2);

}


function changeQty(index, amount) {

    cart[index].quantity += amount;

    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }

    saveCart();

    updateCartCount();

    renderCart();

}


function removeCartItem(index) {

    cart.splice(index, 1);

    saveCart();

    updateCartCount();

    renderCart();

}


/* =========================
   SUBMIT ORDER
========================= */

function submitOrder() {

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }

    const name =
        document.getElementById(
            "customerName"
        ).value.trim();

    const contact =
        document.getElementById(
            "customerContact"
        ).value.trim();

    if (!name || !contact) {

        alert(
            "Please enter your name and contact."
        );

        return;

    }

    let message =
        "NEW WHOLESALE ORDER\n\n";

    message +=
        "Customer: " + name + "\n";

    message +=
        "Contact: " + contact + "\n\n";

    cart.forEach(item => {

        message +=
            `${item.brand} - ${item.product}\n`;

        message +=
            `Variant: ${item.variant}\n`;

        message +=
            `Quantity: ${item.quantity}\n`;

        message +=
            `Price: €${item.price}\n\n`;

    });

    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price * item.quantity,
            0
        );

    message +=
        "TOTAL: €" + total.toFixed(2);

    alert(message);

    /*
       Later you can replace this with:

       - Telegram Bot API
       - WhatsApp
       - Email
       - Your backend API
       - Database
    */

}


/* =========================
   ADMIN
========================= */

function openAdmin() {

    renderAdmin();

    document.getElementById(
        "adminModal"
    ).style.display = "block";

}


function closeAdmin() {

    document.getElementById(
        "adminModal"
    ).style.display = "none";

}


function addBrand() {

    const input =
        document.getElementById("brandName");

    const name =
        input.value.trim();

    if (!name) {

        alert("Enter a brand name.");

        return;

    }

    data.brands.push({

        id: Date.now(),

        name: name,

        products: []

    });

    input.value = "";

    saveData();

    renderAdmin();

    renderBrands();

}


/* =========================
   ADMIN LIST
========================= */

function renderAdmin() {

    const container =
        document.getElementById("adminList");

    container.innerHTML = "";

    data.brands.forEach(brand => {

        const brandDiv =
            document.createElement("div");

        brandDiv.className =
            "admin-item";

        brandDiv.innerHTML = `

            <strong>${brand.name}</strong>

            <br><br>

            <button
                class="secondary"
                onclick="addProduct(${brand.id})"
            >
                + Add Product
            </button>

            <button
                class="danger"
                onclick="deleteBrand(${brand.id})"
            >
                Delete Brand
            </button>

        `;

        brand.products.forEach(product => {

            const productDiv =
                document.createElement("div");

            productDiv.style.marginTop = "12px";

            productDiv.style.padding = "10px";

            productDiv.style.background = "#f5f5f5";

            productDiv.style.borderRadius = "8px";

            productDiv.innerHTML = `

                <strong>
                    ${product.name}
                </strong>

                <br>

                €${product.price}

                <br>

                Variants:
                ${product.variants.join(", ")}

                <br><br>

                <button
                    class="secondary"
                    onclick="addVariant(
                        ${brand.id},
                        ${product.id}
                    )"
                >
                    + Add Variant
                </button>

                <button
                    class="danger"
                    onclick="deleteProduct(
                        ${brand.id},
                        ${product.id}
                    )"
                >
                    Delete
                </button>

            `;

            brandDiv.appendChild(productDiv);

        });

        container.appendChild(brandDiv);

    });

}


/* =========================
   ADD PRODUCT
========================= */

function addProduct(brandId) {

    const name =
        prompt("Product name:");

    if (!name) return;

    const price =
        Number(prompt("Wholesale price:", "25"));

    const stock =
        Number(prompt("Stock quantity:", "100"));

    const image =
        prompt(
            "Image URL (optional):",
            ""
        );

    const brand =
        data.brands.find(
            b => b.id === brandId
        );

    brand.products.push({

        id: Date.now(),

        name: name,

        price: price || 0,

        stock: stock || 0,

        image: image || "",

        variants: []

    });

    saveData();

    renderAdmin();

    renderProducts();

}


/* =========================
   ADD VARIANT
========================= */

function addVariant(
    brandId,
    productId
) {

    const variant =
        prompt("Variant name:");

    if (!variant) return;

    const brand =
        data.brands.find(
            b => b.id === brandId
        );

    const product =
        brand.products.find(
            p => p.id === productId
        );

    product.variants.push(variant);

    saveData();

    renderAdmin();

    renderProducts();

}


/* =========================
   DELETE PRODUCT
========================= */

function deleteProduct(
    brandId,
    productId
) {

    if (!confirm(
        "Delete this product?"
    )) return;

    const brand =
        data.brands.find(
            b => b.id === brandId
        );

    brand.products =
        brand.products.filter(
            p => p.id !== productId
        );

    saveData();

    renderAdmin();

    renderProducts();

}


/* =========================
   DELETE BRAND
========================= */

function deleteBrand(brandId) {

    if (!confirm(
        "Delete this brand and all products?"
    )) return;

    data.brands =
        data.brands.filter(
            b => b.id !== brandId
        );

    selectedBrand =
        data.brands[0]?.id || null;

    saveData();

    renderAdmin();

    renderBrands();

    renderProducts();

}


/* =========================
   INITIALIZE
========================= */

renderBrands();

renderProducts();

updateCartCount();

</script>

</body>
</html>
